<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KAUSHALYA DARSHINI</title>
    <link rel="stylesheet" href="style.css">

<!--

TemplateMo 600 Prism Flux

https://templatemo.com/tm-600-prism-flux

-->
</head>
<body>
    <!-- Loading Screen -->
    <div class="loader" id="loader">
        <div class="loader-content">
            <div class="loader-prism">
                <div class="prism-face"></div>
                <div class="prism-face"></div>
                <div class="prism-face"></div>
            </div>
            <div style="color: var(--accent-purple); font-size: 18px; text-transform: uppercase; letter-spacing: 3px;">Refracting Reality...</div>
        </div>
    </div>

    <!-- Navigation Header -->
    <header class="header" id="header">
        <nav class="nav-container">
            <a href="#home" class="logo">
                <div class="logo-icon">
                    <img src="images/logo.png" alt="KAUSHALYA DARSHINI" class="logo-img">
                </div>
                <span class="logo-text">
                    <span class="prism">KAUSHALYA</span>
                    <span class="flux">DARSHINI</span>
                </span>
            </a>
            
            <ul class="nav-menu" id="navMenu">
                <li><a href="#home" class="nav-link active">Home</a></li>
                <li><a href="#classes" class="nav-link">Classes</a></li>
                <li><a href="#about" class="nav-link">About</a></li>
            </ul>
            
            <div class="menu-toggle" id="menuToggle">
                <span></span>
                <span></span>
                <span></span>
            </div>
        </nav>
    </header>

    <!-- Hero Section with 3D Carousel -->
    <section class="hero" id="home">
        <div class="carousel-container">
            <div class="carousel" id="carousel">
                <!-- Carousel items will be generated by JavaScript -->
            </div>
            
            <div class="carousel-controls">
                <button class="carousel-btn" id="prevBtn">‹</button>
                <button class="carousel-btn" id="nextBtn">›</button>
            </div>
            
            <div class="carousel-indicators" id="indicators">
                <!-- Indicators will be generated by JavaScript -->
            </div>
        </div>
    </section>

    <!-- Classes Gallery Section -->
    <section class="classes-section" id="classes">
        <div class="section-header">
            <h2 class="section-title">Classes</h2>
            <p class="section-subtitle">Explore the image gallery for each class</p>
        </div>
        
        <div class="classes-container">
            <div class="class-picker" id="classPicker">
                <!-- Class tabs will be generated by JavaScript -->
            </div>
            
            <h3 class="gallery-caption" id="galleryCaption">CLASS 10</h3>
            
            <div class="gallery-grid" id="galleryGrid">
                <!-- Gallery items will be generated by JavaScript -->
            </div>
        </div>
    </section>

    <!-- About / Credits Section -->
    <section class="philosophy-section" id="about">
        <div class="philosophy-container">
            <div class="prism-line"></div>
            
            <h2 class="philosophy-headline">
                Credits
            </h2>
            
            <div class="credits-grid">
                <div class="credit-card primary">
                    <h3 class="credit-label">Website Developer</h3>
                    <p class="credit-name">Yeluri Sri Mokshith Sai</p>
                </div>
                
                <div class="credit-card secondary">
                    <h3 class="credit-label">Photography &amp; Image Credits</h3>
                    <p class="credit-name">Yuvaraj Singh</p>
                </div>
            </div>
            
            <div class="philosophy-particles" id="particles">
                <!-- Particles will be generated by JavaScript -->
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="footer">
        <div class="footer-bottom">
            <div class="footer-brand-inline">
                <img src="images/logo.png" alt="KAUSHALYA DARSHINI" class="footer-logo-img">
                <span class="logo-text">
                    <span class="prism">KAUSHALYA</span>
                    <span class="flux">DARSHINI</span>
                </span>
            </div>
            <div class="copyright">
                © 2026 KAUSHALYA DARSHINI. All rights reserved.
            </div>
        </div>
    </footer>
<script src="scripts.js"></script>
</body>
</html>
