<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KAUSHALYA DARSHINI</title>
    <script>
        (function () {
            try {
                if (localStorage.getItem('kd-theme') === 'light') {
                    document.documentElement.setAttribute('data-theme', 'light');
                    document.documentElement.style.backgroundColor = '#F3F0E8';
                } else {
                    document.documentElement.style.backgroundColor = '#0A0A0A';
                }
            } catch (err) { /* storage unavailable - keep dark default */ }
        })();
    </script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Loading Screen -->
    <div class="loader" id="loader">
        <div class="loader-content">
            <div class="loader-logo">
                <span class="loader-glow"></span>
                <span class="loader-ring loader-ring-1"></span>
                <span class="loader-ring loader-ring-2"></span>
                <img src="images/logo.png" alt="KAUSHALYA DARSHINI logo" class="loader-logo-img">
            </div>
            <p class="loader-tagline">Unveiling Memories&hellip;</p>
        </div>
    </div>

    <!-- Navigation Header -->
    <header class="header" id="header">
        <nav class="nav-container">
            <a href="#home" class="logo">
                <div class="logo-icon">
                    <img src="images/logo.png" alt="KAUSHALYA DARSHINI" class="logo-img">
                </div>
                <span class="logo-text">
                    <span class="prism">KAUSHALYA</span>
                    <span class="flux">DARSHINI</span>
                </span>
            </a>
            
            <ul class="nav-menu" id="navMenu">
                <li><a href="#home" class="nav-link active">Home</a></li>
                <li><a href="#classes" class="nav-link">Classes</a></li>
                <li><a href="#about" class="nav-link">About</a></li>
                <li class="theme-toggle-item">
                    <button type="button" class="theme-toggle" id="themeToggle" aria-label="Switch to light mode" title="Switch to light mode">
                        <svg class="theme-icon icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <circle cx="12" cy="12" r="4"/>
                            <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/>
                        </svg>
                        <svg class="theme-icon icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/>
                        </svg>
                    </button>
                </li>
            </ul>
            
            <div class="menu-toggle" id="menuToggle">
                <span></span>
                <span></span>
                <span></span>
            </div>
        </nav>
    </header>

    <!-- Hero Section with 3D Carousel -->
    <section class="hero" id="home">
        <div class="carousel-container">
            <div class="carousel" id="carousel">
                <!-- Carousel items will be generated by JavaScript -->
            </div>
            
            <div class="carousel-controls">
                <button class="carousel-btn" id="prevBtn">‹</button>
                <button class="carousel-btn" id="nextBtn">›</button>
            </div>
            
            <div class="carousel-indicators" id="indicators">
                <!-- Indicators will be generated by JavaScript -->
            </div>
        </div>
    </section>

    <!-- Classes Gallery Section -->
    <section class="classes-section" id="classes">
        <div class="section-header">
            <h2 class="section-title">Classes</h2>
            <p class="section-subtitle">Explore the image gallery for each class</p>
        </div>
        
        <div class="classes-container">
            <div class="class-picker" id="classPicker">
                <!-- Class tabs will be generated by JavaScript -->
            </div>
            
            <h3 class="gallery-caption" id="galleryCaption">CLASS 10</h3>
            
            <div class="gallery-grid" id="galleryGrid">
                <!-- Gallery items will be generated by JavaScript -->
            </div>
        </div>
    </section>

    <!-- About / Credits Section -->
    <section class="philosophy-section" id="about">
        <div class="philosophy-container">
            <div class="prism-line"></div>
            
            <h2 class="philosophy-headline">
                Credits
            </h2>
            
            <div class="credits-grid">
                <div class="credit-card primary">
                    <h3 class="credit-label">Website Developer</h3>
                    <p class="credit-name">Yeluri Sri Mokshith Sai</p>
                </div>
                
                <div class="credit-card secondary">
                    <h3 class="credit-label">Photography &amp; Image Credits</h3>
                    <p class="credit-name">Yuvraj Singh</p>
                </div>
            </div>
            
            <div class="philosophy-particles" id="particles">
                <!-- Particles will be generated by JavaScript -->
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="footer">
        <div class="footer-bottom">
            <div class="footer-brand-inline">
                <img src="images/logo.png" alt="KAUSHALYA DARSHINI" class="footer-logo-img">
                <span class="logo-text">
                    <span class="prism">KAUSHALYA</span>
                    <span class="flux">DARSHINI</span>
                </span>
            </div>
            <div class="copyright">
                © 2026 KAUSHALYA DARSHINI. All rights reserved.
            </div>
        </div>
    </footer>
<script src="scripts.js"></script>
</body>
</html>
